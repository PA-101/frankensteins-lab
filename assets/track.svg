<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <!-- Spooky track background -->
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a0a"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="90" fill="url(#sky)"/>
  <!-- Moon -->
  <circle cx="720" cy="20" r="22" fill="#fffde0" opacity="0.9"/>
  <circle cx="730" cy="12" r="18" fill="#1a0a2a"/>
  <!-- Stars -->
  <circle cx="50" cy="15" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="130" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="220" cy="20" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="310" cy="10" r="1" fill="white" opacity="0.8"/>
  <circle cx="400" cy="5" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="490" cy="18" r="1" fill="white" opacity="0.7"/>
  <circle cx="580" cy="8" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="650" cy="25" r="1" fill="white" opacity="0.6"/>
  <!-- Distant dead trees (left) -->
  <line x1="40" y1="90" x2="40" y2="50" stroke="#2a1a0a" stroke-width="4"/>
  <line x1="40" y1="60" x2="20" y2="40" stroke="#2a1a0a" stroke-width="2"/>
  <line x1="40" y1="65" x2="60" y2="45" stroke="#2a1a0a" stroke-width="2"/>
  <line x1="40" y1="70" x2="15" y2="58" stroke="#2a1a0a" stroke-width="1.5"/>
  <!-- Distant dead trees (right) -->
  <line x1="760" y1="90" x2="760" y2="45" stroke="#2a1a0a" stroke-width="4"/>
  <line x1="760" y1="55" x2="740" y2="35" stroke="#2a1a0a" stroke-width="2"/>
  <line x1="760" y1="60" x2="780" y2="40" stroke="#2a1a0a" stroke-width="2"/>
  <!-- Ground -->
  <rect x="0" y="90" width="800" height="30" fill="url(#ground)"/>
  <!-- Track surface -->
  <rect x="0" y="88" width="800" height="6" fill="#3a2a0a" stroke="#f6ad55" stroke-width="1" opacity="0.6"/>
  <!-- Track lane markings -->
  <line x1="0" y1="91" x2="800" y2="91" stroke="#f6ad55" stroke-width="1" stroke-dasharray="20,15" opacity="0.4"/>
  <!-- Start line -->
  <rect x="60" y="70" width="4" height="24" fill="#68d391" opacity="0.8"/>
  <text x="62" y="68" text-anchor="middle" font-size="9" fill="#68d391" font-family="monospace">GO</text>
  <!-- Finish line -->
  <rect x="730" y="60" width="6" height="34" fill="#f6ad55"/>
  <path d="M730,60 L736,60 L736,66 L730,66 Z" fill="#1a1a1a"/>
  <path d="M730,66 L736,66 L736,72 L730,72 Z" fill="#f6ad55"/>
  <path d="M730,72 L736,72 L736,78 L730,78 Z" fill="#1a1a1a"/>
  <path d="M730,78 L736,78 L736,84 L730,84 Z" fill="#f6ad55"/>
  <text x="733" y="58" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">END</text>
  <!-- Cobblestone texture dots on ground -->
  <circle cx="150" cy="100" r="3" fill="#2a1a00" opacity="0.5"/>
  <circle cx="300" cy="104" r="3" fill="#2a1a00" opacity="0.5"/>
  <circle cx="450" cy="100" r="3" fill="#2a1a00" opacity="0.5"/>
  <circle cx="600" cy="104" r="3" fill="#2a1a00" opacity="0.5"/>
</svg>
