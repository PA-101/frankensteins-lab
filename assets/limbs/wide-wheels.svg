<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <!-- Wide Wheels: two fat wheels on an axle -->
  <!-- Axle -->
  <line x1="10" y1="34" x2="70" y2="34" stroke="#9ae6b4" stroke-width="4" stroke-linecap="round"/>
  <!-- Left wheel -->
  <circle cx="18" cy="38" r="18" fill="#1a3a2a" stroke="#9ae6b4" stroke-width="2.5"/>
  <circle cx="18" cy="38" r="10" fill="none" stroke="#9ae6b4" stroke-width="1" opacity="0.5"/>
  <circle cx="18" cy="38" r="3" fill="#9ae6b4"/>
  <!-- Left wheel spokes -->
  <line x1="18" y1="20" x2="18" y2="56" stroke="#9ae6b4" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="38" x2="36" y2="38" stroke="#9ae6b4" stroke-width="1" opacity="0.6"/>
  <!-- Right wheel -->
  <circle cx="62" cy="38" r="18" fill="#1a3a2a" stroke="#9ae6b4" stroke-width="2.5"/>
  <circle cx="62" cy="38" r="10" fill="none" stroke="#9ae6b4" stroke-width="1" opacity="0.5"/>
  <circle cx="62" cy="38" r="3" fill="#9ae6b4"/>
  <!-- Right wheel spokes -->
  <line x1="62" y1="20" x2="62" y2="56" stroke="#9ae6b4" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="38" x2="80" y2="38" stroke="#9ae6b4" stroke-width="1" opacity="0.6"/>
  <!-- Label -->
  <text x="40" y="12" text-anchor="middle" font-size="8" fill="#9ae6b4" font-family="monospace">WIDE WHEELS</text>
</svg>
