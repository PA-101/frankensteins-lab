<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <!-- Springy Coils: compressed spring legs -->
  <!-- Left spring -->
  <path d="M22,4 Q14,12 22,20 Q30,28 22,36 Q14,44 22,52" fill="none" stroke="#f6ad55" stroke-width="3" stroke-linecap="round"/>
  <!-- Left base pad -->
  <rect x="10" y="52" width="24" height="6" rx="3" fill="#2d3748" stroke="#f6ad55" stroke-width="1.5"/>
  <!-- Right spring -->
  <path d="M58,4 Q50,12 58,20 Q66,28 58,36 Q50,44 58,52" fill="none" stroke="#f6ad55" stroke-width="3" stroke-linecap="round"/>
  <!-- Right base pad -->
  <rect x="46" y="52" width="24" height="6" rx="3" fill="#2d3748" stroke="#f6ad55" stroke-width="1.5"/>
  <!-- Label -->
  <text x="40" y="12" text-anchor="middle" font-size="8" fill="#f6ad55" font-family="monospace">SPRINGY COILS</text>
</svg>
