<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <!-- Mad Scientist character -->
  <!-- Lab coat body -->
  <rect x="20" y="80" width="80" height="80" rx="8" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
  <!-- Coat lapels -->
  <path d="M50,80 L40,120 L60,110 Z" fill="#d0d0d0"/>
  <path d="M70,80 L80,120 L60,110 Z" fill="#d0d0d0"/>
  <!-- Buttons -->
  <circle cx="60" cy="120" r="3" fill="#888"/>
  <circle cx="60" cy="135" r="3" fill="#888"/>
  <!-- Neck -->
  <rect x="50" y="66" width="20" height="18" rx="4" fill="#f4a261"/>
  <!-- Head -->
  <ellipse cx="60" cy="52" rx="28" ry="30" fill="#f4a261" stroke="#c27640" stroke-width="1.5"/>
  <!-- Wild hair -->
  <path d="M32,38 Q28,10 40,14 Q36,24 42,22" fill="#c8c8c8" stroke="#aaa" stroke-width="1"/>
  <path d="M38,26 Q30,4 48,8 Q44,20 50,18" fill="#c8c8c8" stroke="#aaa" stroke-width="1"/>
  <path d="M88,38 Q92,10 80,14 Q84,24 78,22" fill="#c8c8c8" stroke="#aaa" stroke-width="1"/>
  <path d="M82,26 Q90,4 72,8 Q76,20 70,18" fill="#c8c8c8" stroke="#aaa" stroke-width="1"/>
  <!-- Goggles frame -->
  <rect x="34" y="40" width="22" height="16" rx="8" fill="none" stroke="#555" stroke-width="2.5"/>
  <rect x="64" y="40" width="22" height="16" rx="8" fill="none" stroke="#555" stroke-width="2.5"/>
  <line x1="56" y1="48" x2="64" y2="48" stroke="#555" stroke-width="2"/>
  <!-- Goggle lenses -->
  <rect x="35" y="41" width="20" height="14" rx="7" fill="#68d391" opacity="0.5"/>
  <rect x="65" y="41" width="20" height="14" rx="7" fill="#68d391" opacity="0.5"/>
  <!-- Eyes behind goggles -->
  <circle cx="45" cy="48" r="4" fill="#1a1a1a"/>
  <circle cx="75" cy="48" r="4" fill="#1a1a1a"/>
  <circle cx="46" cy="47" r="1.5" fill="white"/>
  <circle cx="76" cy="47" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="60" cy="58" rx="5" ry="4" fill="#e08050"/>
  <!-- Mouth (maniacal grin) -->
  <path d="M44,66 Q60,76 76,66" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,67 Q52,72 56,67" fill="#ff6b6b"/>
  <path d="M64,67 Q68,72 72,67" fill="#ff6b6b"/>
  <!-- Arms -->
  <rect x="4" y="85" width="18" height="50" rx="8" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
  <rect x="98" y="85" width="18" height="50" rx="8" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
  <!-- Hands -->
  <ellipse cx="13" cy="140" rx="10" ry="8" fill="#f4a261" stroke="#c27640" stroke-width="1"/>
  <ellipse cx="107" cy="140" rx="10" ry="8" fill="#f4a261" stroke="#c27640" stroke-width="1"/>
  <!-- Pocket protector -->
  <rect x="22" y="88" width="14" height="20" rx="2" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <line x1="26" y1="90" x2="26" y2="106" stroke="#68d391" stroke-width="1.5"/>
  <line x1="30" y1="90" x2="30" y2="106" stroke="#f6ad55" stroke-width="1.5"/>
</svg>
