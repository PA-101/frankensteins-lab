<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="bridge-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#2a1a00"/>
    </linearGradient>
  </defs>
  <!-- Foggy amber sky -->
  <rect width="800" height="120" fill="url(#bridge-sky)"/>
  <!-- Fog layers -->
  <rect x="0"   y="50" width="800" height="30" fill="#f6ad55" opacity="0.04"/>
  <rect x="0"   y="60" width="800" height="20" fill="#f6ad55" opacity="0.06"/>
  <!-- Chasm below bridge (void) -->
  <rect x="80" y="88" width="640" height="32" fill="#0a0500"/>
  <!-- Chasm walls -->
  <rect x="80"  y="88" width="8"  height="32" fill="#2a1500"/>
  <rect x="712" y="88" width="8"  height="32" fill="#2a1500"/>
  <!-- Bridge planks -->
  <rect x="80" y="84" width="640" height="8" fill="#5a3a10" stroke="#8b5a1a" stroke-width="1"/>
  <!-- Plank seams -->
  <line x1="140" y1="84" x2="140" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="200" y1="84" x2="200" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="260" y1="84" x2="260" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="320" y1="84" x2="320" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="380" y1="84" x2="380" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="440" y1="84" x2="440" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="500" y1="84" x2="500" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="560" y1="84" x2="560" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="620" y1="84" x2="620" y2="92" stroke="#2a1500" stroke-width="2"/>
  <line x1="680" y1="84" x2="680" y2="92" stroke="#2a1500" stroke-width="2"/>
  <!-- One broken plank mid-bridge -->
  <rect x="378" y="84" width="22" height="4" fill="#2a1500" opacity="0.8"/>
  <text x="389" y="82" text-anchor="middle" font-size="7" fill="#f6ad55" font-family="monospace" opacity="0.7">!</text>
  <!-- Bridge rope rails -->
  <path d="M80,74 Q400,60 720,74" fill="none" stroke="#8b5a1a" stroke-width="2"/>
  <path d="M80,78 Q400,64 720,78" fill="none" stroke="#8b5a1a" stroke-width="2"/>
  <!-- Rope hangers -->
  <line x1="140" y1="68" x2="140" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="64" x2="200" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="260" y1="62" x2="260" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="61" x2="320" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="380" y1="61" x2="380" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="440" y1="61" x2="440" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="500" y1="62" x2="500" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="560" y1="64" x2="560" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="620" y1="66" x2="620" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <line x1="680" y1="68" x2="680" y2="84" stroke="#8b5a1a" stroke-width="1" opacity="0.6"/>
  <!-- Land on left -->
  <rect x="0" y="84" width="88" height="36" fill="#2a1a00"/>
  <!-- Land on right -->
  <rect x="712" y="84" width="88" height="36" fill="#2a1a00"/>
  <!-- Torch flames on posts -->
  <rect x="76"  y="70" width="6" height="18" fill="#5a3a10"/>
  <ellipse cx="79" cy="68" rx="5" ry="8" fill="#f6ad55" opacity="0.8"/>
  <ellipse cx="79" cy="65" rx="3" ry="6" fill="#ff8c00" opacity="0.9"/>
  <rect x="718" y="70" width="6" height="18" fill="#5a3a10"/>
  <ellipse cx="721" cy="68" rx="5" ry="8" fill="#f6ad55" opacity="0.8"/>
  <ellipse cx="721" cy="65" rx="3" ry="6" fill="#ff8c00" opacity="0.9"/>
  <!-- Warning sign (heavy) -->
  <rect x="330" y="58" width="140" height="16" rx="3" fill="#2a1500" stroke="#f6ad55" stroke-width="1"/>
  <text x="400" y="70" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">⚠ HEAVY LOADS FORBIDDEN</text>
  <!-- GO flag -->
  <rect x="58" y="68" width="4" height="18" fill="#68d391" opacity="0.8"/>
  <text x="60" y="66" text-anchor="middle" font-size="9" fill="#68d391" font-family="monospace">GO</text>
  <!-- Finish flag -->
  <rect x="728" y="58" width="6" height="28" fill="#f6ad55"/>
  <path d="M728,58 L734,58 L734,64 L728,64 Z" fill="#1a1a1a"/>
  <path d="M728,64 L734,64 L734,70 L728,70 Z" fill="#f6ad55"/>
  <path d="M728,70 L734,70 L734,76 L728,76 Z" fill="#1a1a1a"/>
  <path d="M728,76 L734,76 L734,82 L728,82 Z" fill="#f6ad55"/>
  <text x="731" y="56" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">END</text>
</svg>
