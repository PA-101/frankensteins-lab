<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="flat-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a0a2a"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="90" fill="url(#flat-sky)"/>
  <!-- Moon -->
  <circle cx="720" cy="20" r="22" fill="#fffde0" opacity="0.9"/>
  <circle cx="730" cy="12" r="18" fill="#1a0a2a"/>
  <!-- Stars -->
  <circle cx="50"  cy="15" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="130" cy="8"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="220" cy="20" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="310" cy="10" r="1"   fill="white" opacity="0.8"/>
  <circle cx="400" cy="5"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="490" cy="18" r="1"   fill="white" opacity="0.7"/>
  <circle cx="580" cy="8"  r="1.5" fill="white" opacity="0.8"/>
  <!-- Dead trees left -->
  <line x1="40" y1="90" x2="40" y2="50" stroke="#2a1a0a" stroke-width="4"/>
  <line x1="40" y1="60" x2="20" y2="40" stroke="#2a1a0a" stroke-width="2"/>
  <line x1="40" y1="65" x2="60" y2="45" stroke="#2a1a0a" stroke-width="2"/>
  <!-- Dead trees right -->
  <line x1="760" y1="90" x2="760" y2="45" stroke="#2a1a0a" stroke-width="4"/>
  <line x1="760" y1="55" x2="740" y2="35" stroke="#2a1a0a" stroke-width="2"/>
  <line x1="760" y1="60" x2="780" y2="40" stroke="#2a1a0a" stroke-width="2"/>
  <!-- Gravestones -->
  <rect x="80"  y="72" width="12" height="18" rx="6" fill="#3a3a4a" stroke="#555" stroke-width="1"/>
  <rect x="160" y="68" width="10" height="22" rx="5" fill="#2a2a3a" stroke="#444" stroke-width="1"/>
  <rect x="620" y="70" width="12" height="20" rx="6" fill="#3a3a4a" stroke="#555" stroke-width="1"/>
  <rect x="700" y="66" width="10" height="24" rx="5" fill="#2a2a3a" stroke="#444" stroke-width="1"/>
  <!-- Ground -->
  <rect x="0"   y="88" width="800" height="32" fill="#1a1000"/>
  <!-- Road surface (flat cobblestone) -->
  <rect x="0"   y="86" width="800" height="8" fill="#2a2000" stroke="#f6ad55" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="90" x2="800" y2="90" stroke="#f6ad55" stroke-width="0.8" stroke-dasharray="20,15" opacity="0.4"/>
  <!-- GO flag -->
  <rect x="58" y="68" width="4" height="22" fill="#68d391" opacity="0.8"/>
  <text x="60" y="66" text-anchor="middle" font-size="9" fill="#68d391" font-family="monospace">GO</text>
  <!-- Finish flag -->
  <rect x="728" y="58" width="6" height="34" fill="#f6ad55"/>
  <path d="M728,58 L734,58 L734,64 L728,64 Z" fill="#1a1a1a"/>
  <path d="M728,64 L734,64 L734,70 L728,70 Z" fill="#f6ad55"/>
  <path d="M728,70 L734,70 L734,76 L728,76 Z" fill="#1a1a1a"/>
  <path d="M728,76 L734,76 L734,82 L728,82 Z" fill="#f6ad55"/>
  <text x="731" y="56" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">END</text>
</svg>
