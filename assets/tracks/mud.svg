<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="mud-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1205"/>
      <stop offset="100%" stop-color="#1a2a0a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a1a00"/>
      <stop offset="50%"  stop-color="#3a2800"/>
      <stop offset="100%" stop-color="#2a1a00"/>
    </linearGradient>
  </defs>
  <!-- Stormy sky -->
  <rect width="800" height="90" fill="url(#mud-sky)"/>
  <!-- Storm clouds -->
  <ellipse cx="200" cy="22" rx="80" ry="22" fill="#1a2a1a" opacity="0.8"/>
  <ellipse cx="260" cy="18" rx="60" ry="18" fill="#2a3a2a" opacity="0.7"/>
  <ellipse cx="560" cy="25" rx="90" ry="20" fill="#1a2a1a" opacity="0.8"/>
  <ellipse cx="510" cy="20" rx="55" ry="16" fill="#2a3a2a" opacity="0.7"/>
  <!-- Lightning bolts -->
  <path d="M230,30 L222,50 L228,50 L218,70" fill="none" stroke="#f6ad55" stroke-width="1.5" opacity="0.7"/>
  <path d="M570,32 L562,52 L568,52 L558,72" fill="none" stroke="#f6ad55" stroke-width="1.5" opacity="0.6"/>
  <!-- Hill ground profile -->
  <path d="M0,90 Q200,55 400,52 Q600,55 800,90 L800,120 L0,120 Z" fill="url(#hill)"/>
  <!-- Mud surface -->
  <path d="M0,90 Q200,55 400,52 Q600,55 800,90" fill="none" stroke="#68d391" stroke-width="1" opacity="0.3" stroke-dasharray="12,10"/>
  <!-- Mud puddles / ruts -->
  <ellipse cx="150" cy="88" rx="30" ry="5" fill="#1a0f00" opacity="0.7"/>
  <ellipse cx="380" cy="62" rx="25" ry="4" fill="#1a0f00" opacity="0.7"/>
  <ellipse cx="600" cy="78" rx="28" ry="4" fill="#1a0f00" opacity="0.7"/>
  <!-- Tire-track ruts -->
  <path d="M0,86 Q400,50 800,86" fill="none" stroke="#3a2800" stroke-width="3" opacity="0.5"/>
  <path d="M0,89 Q400,53 800,89" fill="none" stroke="#3a2800" stroke-width="3" opacity="0.5"/>
  <!-- Rain streaks -->
  <line x1="100" y1="0" x2="92"  y2="50" stroke="#68d391" stroke-width="0.8" opacity="0.2"/>
  <line x1="250" y1="0" x2="242" y2="50" stroke="#68d391" stroke-width="0.8" opacity="0.2"/>
  <line x1="400" y1="0" x2="392" y2="50" stroke="#68d391" stroke-width="0.8" opacity="0.2"/>
  <line x1="550" y1="0" x2="542" y2="50" stroke="#68d391" stroke-width="0.8" opacity="0.2"/>
  <line x1="700" y1="0" x2="692" y2="50" stroke="#68d391" stroke-width="0.8" opacity="0.2"/>
  <!-- Warning sign (mud) -->
  <rect x="360" y="40" width="80" height="16" rx="3" fill="#2a2a00" stroke="#f6ad55" stroke-width="1"/>
  <text x="400" y="52" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">⚠ MUD</text>
  <!-- GO flag -->
  <rect x="58" y="68" width="4" height="22" fill="#68d391" opacity="0.8"/>
  <text x="60" y="66" text-anchor="middle" font-size="9" fill="#68d391" font-family="monospace">GO</text>
  <!-- Finish flag -->
  <rect x="728" y="58" width="6" height="34" fill="#f6ad55"/>
  <path d="M728,58 L734,58 L734,64 L728,64 Z" fill="#1a1a1a"/>
  <path d="M728,64 L734,64 L734,70 L728,70 Z" fill="#f6ad55"/>
  <path d="M728,70 L734,70 L734,76 L728,76 Z" fill="#1a1a1a"/>
  <path d="M728,76 L734,76 L734,82 L728,82 Z" fill="#f6ad55"/>
  <text x="731" y="56" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">END</text>
</svg>
