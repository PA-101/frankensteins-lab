<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <!-- Barrel Chest: rounded barrel shape -->
  <!-- Neck -->
  <rect x="32" y="2" width="16" height="14" rx="4" fill="#2a4a3a" stroke="#9ae6b4" stroke-width="1.5"/>
  <!-- Main barrel body -->
  <ellipse cx="40" cy="48" rx="30" ry="30" fill="#1a3a2a" stroke="#9ae6b4" stroke-width="2"/>
  <!-- Barrel hoops -->
  <ellipse cx="40" cy="30" rx="28" ry="6" fill="none" stroke="#9ae6b4" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="40" cy="48" rx="30" ry="6" fill="none" stroke="#9ae6b4" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="40" cy="66" rx="28" ry="6" fill="none" stroke="#9ae6b4" stroke-width="1.5" opacity="0.7"/>
  <!-- Center emblem -->
  <circle cx="40" cy="48" r="8" fill="#2a4a3a" stroke="#9ae6b4" stroke-width="1.5"/>
  <text x="40" y="52" text-anchor="middle" font-size="10" fill="#9ae6b4" font-family="monospace">⚡</text>
  <!-- Label -->
  <text x="40" y="88" text-anchor="middle" font-size="9" fill="#9ae6b4" font-family="monospace">BARREL</text>
  <text x="40" y="98" text-anchor="middle" font-size="9" fill="#9ae6b4" font-family="monospace">CHEST</text>
</svg>
