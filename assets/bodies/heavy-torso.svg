<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <!-- Heavy Torso: wide, thick, armoured -->
  <!-- Neck -->
  <rect x="30" y="2" width="20" height="16" rx="3" fill="#553c1a" stroke="#f6ad55" stroke-width="1.5"/>
  <!-- Bolts on neck -->
  <circle cx="27" cy="10" r="4" fill="#2d3748" stroke="#f6ad55" stroke-width="1.5"/>
  <circle cx="53" cy="10" r="4" fill="#2d3748" stroke="#f6ad55" stroke-width="1.5"/>
  <!-- Main torso: wide and squat -->
  <rect x="10" y="18" width="60" height="52" rx="5" fill="#3c2a10" stroke="#f6ad55" stroke-width="2.5"/>
  <!-- Armour plates -->
  <rect x="14" y="22" width="24" height="20" rx="2" fill="#553c1a" stroke="#f6ad55" stroke-width="1"/>
  <rect x="42" y="22" width="24" height="20" rx="2" fill="#553c1a" stroke="#f6ad55" stroke-width="1"/>
  <rect x="14" y="46" width="52" height="20" rx="2" fill="#553c1a" stroke="#f6ad55" stroke-width="1"/>
  <!-- Rivets -->
  <circle cx="18" cy="26" r="2" fill="#f6ad55"/>
  <circle cx="62" cy="26" r="2" fill="#f6ad55"/>
  <circle cx="18" cy="62" r="2" fill="#f6ad55"/>
  <circle cx="62" cy="62" r="2" fill="#f6ad55"/>
  <!-- Label -->
  <text x="40" y="82" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">HEAVY</text>
  <text x="40" y="92" text-anchor="middle" font-size="9" fill="#f6ad55" font-family="monospace">TORSO</text>
</svg>
