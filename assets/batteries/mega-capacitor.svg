<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60" height="80">
  <!-- Mega Capacitor: cylindrical high-power capacitor -->
  <!-- Top terminals -->
  <rect x="16" y="2" width="8" height="10" rx="2" fill="#9ae6b4"/>
  <rect x="36" y="2" width="8" height="10" rx="2" fill="#9ae6b4"/>
  <!-- Cylinder body -->
  <ellipse cx="30" cy="18" rx="24" ry="6" fill="#1a4a2a" stroke="#9ae6b4" stroke-width="2"/>
  <rect x="6" y="18" width="48" height="50" fill="#1a4a2a" stroke="#9ae6b4" stroke-width="2"/>
  <ellipse cx="30" cy="68" rx="24" ry="6" fill="#1a4a2a" stroke="#9ae6b4" stroke-width="2"/>
  <!-- Charge bars: full -->
  <rect x="10" y="54" width="40" height="10" rx="2" fill="#1a4a2a" stroke="#9ae6b4" stroke-width="1"/>
  <rect x="12" y="56" width="8" height="6" rx="1" fill="#9ae6b4"/>
  <rect x="22" y="56" width="8" height="6" rx="1" fill="#9ae6b4"/>
  <rect x="32" y="56" width="8" height="6" rx="1" fill="#9ae6b4"/>
  <!-- Energy arcs -->
  <path d="M18,28 Q30,22 42,28" fill="none" stroke="#9ae6b4" stroke-width="1.5" opacity="0.7"/>
  <path d="M14,36 Q30,28 46,36" fill="none" stroke="#9ae6b4" stroke-width="1.5" opacity="0.5"/>
  <!-- Label -->
  <text x="30" y="40" text-anchor="middle" font-size="7" fill="#9ae6b4" font-family="monospace">MEGA</text>
  <text x="30" y="50" text-anchor="middle" font-size="7" fill="#9ae6b4" font-family="monospace">CAP</text>
</svg>
