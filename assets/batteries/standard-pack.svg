<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60" height="80">
  <!-- Standard Pack: rectangular battery pack -->
  <!-- Terminal cap -->
  <rect x="20" y="2" width="20" height="8" rx="3" fill="#f6ad55"/>
  <!-- Body -->
  <rect x="6" y="10" width="48" height="62" rx="5" fill="#3c2a10" stroke="#f6ad55" stroke-width="2"/>
  <!-- Charge bars: medium -->
  <rect x="10" y="54" width="40" height="12" rx="2" fill="#3c2a10" stroke="#f6ad55" stroke-width="1"/>
  <rect x="12" y="56" width="10" height="8" rx="1" fill="#f6ad55" opacity="0.8"/>
  <rect x="24" y="56" width="10" height="8" rx="1" fill="#f6ad55" opacity="0.8"/>
  <rect x="36" y="56" width="10" height="8" rx="1" fill="#f6ad55" opacity="0.3"/>
  <!-- Lightning bolt -->
  <path d="M34,16 L24,36 L30,36 L26,56 L40,30 L33,30 Z" fill="#f6ad55"/>
  <!-- Label -->
  <text x="30" y="22" text-anchor="middle" font-size="7" fill="#f6ad55" font-family="monospace">STD</text>
  <text x="30" y="30" text-anchor="middle" font-size="7" fill="#f6ad55" font-family="monospace">PACK</text>
</svg>
